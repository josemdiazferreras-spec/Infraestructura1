# FGT-CLIENT - configuración relevante
# Matrícula: 2025-0693

config system interface
    edit "port1"
        set vdom "root"
        set ip 200.6.93.2 255.255.255.252
        set allowaccess ping https ssh http
        set type physical
    next
    edit "port2"
        set vdom "root"
        set type physical
    next
    edit "VLAN10"
        set vdom "root"
        set ip 10.6.93.1 255.255.255.128
        set allowaccess ping
        set device-identification enable
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VPNCLIENTSERVER"
        set vdom "root"
        set type tunnel
        set interface "port1"
    next
end

config system dhcp server
    edit 2
        set dns-service default
        set default-gateway 10.6.93.1
        set netmask 255.255.255.128
        set interface "VLAN10"
        config ip-range
            edit 1
                set start-ip 10.6.93.10
                set end-ip 10.6.93.100
            next
        end
    next
end

config router static
    edit 1
        set gateway 200.6.93.1
        set device "port1"
    next
    edit 2
        set device "VPNCLIENTSERVER"
        set comment "VPN: VPNCLIENTSERVER (Created by VPN wizard)"
        set dstaddr "VPNCLIENTSERVER_remote"
    next
    edit 3
        set distance 254
        set comment "VPN: VPNCLIENTSERVER (Created by VPN wizard)"
        set blackhole enable
        set dstaddr "VPNCLIENTSERVER_remote"
    next
end

config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "VLAN10"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "vpn_VPNCLIENTSERVER_local_0"
        set srcintf "VLAN10"
        set dstintf "VPNCLIENTSERVER"
        set action accept
        set srcaddr "VPNCLIENTSERVER_local"
        set dstaddr "VPNCLIENTSERVER_remote"
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "vpn_VPNCLIENTSERVER_remote_0"
        set srcintf "VPNCLIENTSERVER"
        set dstintf "VLAN10"
        set action accept
        set srcaddr "VPNCLIENTSERVER_remote"
        set dstaddr "VPNCLIENTSERVER_local"
        set schedule "always"
        set service "ALL"
    next
end

config vpn ipsec phase1-interface
    edit "VPNCLIENTSERVER"
        set interface "port1"
        set peertype any
        set net-device disable
        set proposal des-md5 des-sha1
        set wizard-type static-fortigate
        set remote-gw 200.6.93.6
        # PSK omitida intencionalmente del repositorio
    next
end

config vpn ipsec phase2-interface
    edit "VPNCLIENTSERVER"
        set phase1name "VPNCLIENTSERVER"
        set proposal des-md5 des-sha1
        set src-addr-type name
        set dst-addr-type name
        set src-name "VPNCLIENTSERVER_local"
        set dst-name "VPNCLIENTSERVER_remote"
    next
end
